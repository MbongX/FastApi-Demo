{% extends "layout.html" %}

{% block content %}
    <!--Updating the template to display the posts-->
    <!--to use a for loop-->
    {% for post in posts %}
        <!--To access values| or display variable within the context dictionary-->
        <h2>{{post.title}}</h2>
        <p>{{post.content}}</p>
    <!--To end the for loop-->
    {% endfor %}
{% endblock content %}
